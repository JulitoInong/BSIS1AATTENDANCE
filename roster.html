<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./ChatGPT%20Image%20Aug%209,%202026,%2004_55_02%20PM.png">
<title>BSIS 1-A • Student Roster</title>
<script src="./theme.js"></script><script src="./splash.js"></script>
<style>
@import url("./motion.css");
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe2ec;--navy:#102852;--soft:#eef2f7;--success:#15803d;--success-bg:#dcfce7;--absent:#64748b;--absent-bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2f7 0,#f8fafc 34%,var(--bg) 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:0 auto;padding:18px 14px calc(34px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;min-width:0}.brand-mark{width:54px;height:54px;flex:none;border:2px solid #fff;border-radius:50%;background:#07152f url('./ChatGPT%20Image%20Aug%209,%202026,%2004_55_02%20PM.png') center/cover no-repeat;box-shadow:0 4px 12px rgba(15,23,42,.18)}.eyebrow{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.brand h1{font-size:19px;line-height:1.15;margin:3px 0 0}.top-actions{display:flex;align-items:center;gap:12px}.datebox{text-align:right;font-size:11px;color:var(--muted)}.datebox b{display:block;color:var(--ink);font-size:12px}.nav-link,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 13px;border:0;border-radius:8px;background:var(--navy);color:#fff;text-decoration:none;font-size:12px;font-weight:800}.nav-link:hover,.btn:hover{background:#17386d}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 14px;border-bottom:1px solid var(--line)}.page-head h2{font-size:19px;margin:0}.page-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.tools{display:flex;gap:9px;align-items:center;margin:14px 0 10px}.search{position:relative;flex:1}.search span{position:absolute;left:12px;top:10px;color:#94a3b8}.search input{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px 9px 34px;background:#fff;color:var(--ink);outline:none}.search input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.13)}.filters{display:flex;gap:6px;margin:0 0 10px}.filter{min-height:34px;padding:7px 11px;border:0;border-radius:7px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}.filter.active{background:var(--navy);color:#fff}.list{border-top:1px solid var(--line)}.student{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}.avatar{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;background:#e2e8f0;font-size:11px;font-weight:900}.student-main{flex:1;min-width:0}.student-name{display:block;max-width:100%;padding:0;border:0;background:transparent;color:var(--ink);font-size:12px;font-weight:800;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.student-name:hover{text-decoration:underline}.student-name:focus-visible,.filter:focus-visible,.btn:focus-visible,.nav-link:focus-visible,.close:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:2px}.student-time{margin-top:2px;color:var(--muted);font-size:10px}.student-time:empty{display:none}.status-pill{flex:none;padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900}.status-present{background:var(--success-bg);color:var(--success)}.status-absent{background:var(--absent-bg);color:var(--absent)}.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:12px}.footer{margin-top:16px;color:#94a3b8;text-align:center;font-size:10px}.student-dialog{width:min(420px,calc(100vw - 32px));padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(15,23,42,.24)}.student-dialog::backdrop{background:rgba(3,13,29,.58)}.dialog-inner{padding:20px}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.dialog-head h3{margin:4px 0 0;font-size:18px}.close{width:36px;height:36px;border:0;border-radius:8px;background:var(--soft);color:var(--ink);font-size:22px;cursor:pointer}.meta{display:grid;gap:12px;margin:18px 0 0}.meta div{border-top:1px solid var(--line);padding-top:10px}.meta dt{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.meta dd{margin:4px 0 0;font-size:14px;font-weight:700}.meta .present{color:var(--success)}.meta .absent{color:var(--muted)}
@media(max-width:520px){.app{padding:12px 12px calc(26px + env(safe-area-inset-bottom))}.topbar{margin-bottom:12px}.brand-mark{width:46px;height:46px}.brand h1{font-size:17px}.datebox{display:none}.top-actions{gap:0}.page-head{align-items:flex-start;flex-direction:column}.tools{flex-direction:column;align-items:stretch}.tools .nav-link{width:100%}.student{gap:9px}.status-pill{font-size:8px;padding:6px 7px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"></span><span><span class="eyebrow">BSIS • School Year 2026–2027</span><h1>Student Roster</h1></span></a><div class="top-actions"><div class="datebox"><b id="todayLabel">—</b><span id="dayLabel">—</span></div></div></header>
<nav class="page-tabs" aria-label="Attendance pages"><a class="page-tab" href="./index.html">Regular Attendance</a><a class="page-tab" href="./session-attendance.html">Time In / Out</a><a class="page-tab active" href="./roster.html" aria-current="page">Student Roster</a></nav>
<section class="page-head"><div><h2>All Students</h2><p><span id="visibleCount">46</span> of <span id="totalCount">46</span> students</p></div></section>
<div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search by name or student number" autocomplete="off"></label></div>
<div class="filters" role="group" aria-label="Filter students"><button type="button" class="filter active" data-filter="all">All</button><button type="button" class="filter" data-filter="present">Present</button><button type="button" class="filter" data-filter="absent">Absent</button></div>
<div id="rosterList" class="list" aria-live="polite"></div>
<div class="footer">BSIS 1-A • Attendance records are saved on this device.<span class="footer-credit">Built by Julito Inong, Class President</span></div>
</main>
<dialog id="studentDialog" class="student-dialog" aria-labelledby="studentDetailName"><div class="dialog-inner"><div class="dialog-head"><div><div class="eyebrow">Student details</div><h3 id="studentDetailName">—</h3></div><button type="button" class="close" aria-label="Close student details">×</button></div><dl class="meta"><div><dt>Student No.</dt><dd id="studentDetailNo">—</dd></div><div><dt>Attendance</dt><dd id="studentDetailStatus">—</dd></div><div id="studentDetailTimeRow"><dt>Check-in time</dt><dd id="studentDetailTime">—</dd></div></dl></div></dialog>
<script src="./roster-data.js"></script>
<script>
const ROSTER=window.BSIS_ROSTER;
const STORAGE_PREFIX="bsis1a_attendance_";
let todayKey="",attendance={},filterMode="all";
function localDateKey(date=new Date()){const year=date.getFullYear(),month=String(date.getMonth()+1).padStart(2,"0"),day=String(date.getDate()).padStart(2,"0");return `${year}-${month}-${day}`}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function initials(name){return name.split(",")[0].trim().slice(0,2).toUpperCase()}
function loadAttendance(){todayKey=localDateKey();try{attendance=JSON.parse(localStorage.getItem(STORAGE_PREFIX+todayKey)||"{}")}catch(error){attendance={}}renderRoster()}
function renderRoster(){const query=document.getElementById("search").value.trim().toLowerCase();const presentCount=ROSTER.filter(student=>!!attendance[student.student_no]).length;const counts={all:ROSTER.length,present:presentCount,absent:ROSTER.length-presentCount};document.querySelectorAll(".filter").forEach(button=>{const mode=button.dataset.filter;button.textContent=`${mode[0].toUpperCase()+mode.slice(1)} (${counts[mode]})`;button.classList.toggle("active",filterMode===mode)});const rows=ROSTER.filter(student=>{const record=attendance[student.student_no],present=!!record;const matchesQuery=student.full_name.toLowerCase().includes(query)||student.student_no.includes(query);return matchesQuery&&(filterMode==="all"||(filterMode==="present"&&present)||(filterMode==="absent"&&!present))});document.getElementById("visibleCount").textContent=rows.length;document.getElementById("totalCount").textContent=ROSTER.length;const list=document.getElementById("rosterList");if(!rows.length){list.innerHTML='<div class="empty">No students match this view.</div>';return}list.innerHTML=rows.map(student=>{const record=attendance[student.student_no];return `<div class="student"><div class="avatar">${escapeHTML(initials(student.full_name))}</div><div class="student-main"><button type="button" class="student-name" data-student-no="${escapeHTML(student.student_no)}">${escapeHTML(student.full_name)}</button><div class="student-time">${record?"Checked in "+escapeHTML(record.time):""}</div></div><span class="status-pill ${record?"status-present":"status-absent"}">${record?"PRESENT":"ABSENT"}</span></div>`}).join("")}
function showStudentDetails(studentNo){const student=ROSTER.find(entry=>entry.student_no===studentNo);if(!student)return;const record=attendance[studentNo];document.getElementById("studentDetailName").textContent=student.full_name;document.getElementById("studentDetailNo").textContent=student.student_no||"Not assigned";const status=document.getElementById("studentDetailStatus");status.textContent=record?"Present":"Absent";status.className=record?"present":"absent";document.getElementById("studentDetailTime").textContent=record?.time||"—";document.getElementById("studentDetailTimeRow").hidden=!record;document.getElementById("studentDialog").showModal()}
document.getElementById("search").addEventListener("input",renderRoster);
document.querySelector(".filters").addEventListener("click",event=>{const button=event.target.closest("[data-filter]");if(button){filterMode=button.dataset.filter;renderRoster()}});
document.getElementById("rosterList").addEventListener("click",event=>{const button=event.target.closest(".student-name");if(button)showStudentDetails(button.dataset.studentNo)});
document.getElementById("studentDialog").addEventListener("click",event=>{if(event.target===event.currentTarget)event.currentTarget.close()});
document.getElementById("studentDialog").addEventListener("keydown",event=>{if(event.key==="Escape"){event.preventDefault();event.currentTarget.close()}});
document.querySelector(".close").addEventListener("click",()=>document.getElementById("studentDialog").close());
function refreshDate(){const now=new Date(),key=localDateKey(now);if(key!==todayKey)loadAttendance();document.getElementById("todayLabel").textContent=new Intl.DateTimeFormat(undefined,{month:"long",day:"numeric",year:"numeric"}).format(now);document.getElementById("dayLabel").textContent=new Intl.DateTimeFormat(undefined,{weekday:"long"}).format(now)}
window.addEventListener("storage",event=>{if(event.key===STORAGE_PREFIX+todayKey)loadAttendance()});window.addEventListener("focus",refreshDate);document.addEventListener("visibilitychange",refreshDate);setInterval(refreshDate,30000);
loadAttendance();refreshDate();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
